# ==================== 路由规则 ====================
rules:
  - DST-PORT,53/853,dns_hijack
  - PROCESS-NAME,jp.konami.pesam,Games
  - RULE-SET,game_domain,Games
  - SUB-RULE,(AND,((NETWORK,UDP),(DST-PORT,443))),QUIC
  - DST-PORT,3478-3481/5349/10000/19302-19309,BANAD
  - RULE-SET,google_fcm_domain,FCM
  - RULE-SET,telegram_domain,Telegram
  - RULE-SET,telegram_ip,Telegram,no-resolve
  - SUB-RULE,(OR,((RULE-SET,adblock_domain),(RULE-SET,ablock_domain))),ADS
  - RULE-SET,bilibili_ip,BiliBili
  - RULE-SET,bilibili_domain,BiliBili
  - RULE-SET,tiktok_ip,TikTok
  - RULE-SET,tiktok_domain,TikTok
  - RULE-SET,twitter_ip,Google
  - RULE-SET,twitter_domain,Twitter
  - RULE-SET,media_ip,Media
  - RULE-SET,media_domain,Media
  - RULE-SET,ai_domain,AI
  - RULE-SET,pixiv_domain,Pixiv
  - RULE-SET,proxy_emby_domain,Emby
  - RULE-SET,direct_emby_domain,Direct
  - RULE-SET,github_domain,Github
  - RULE-SET,google_ip,Google
  - RULE-SET,google_domain,Google
  - RULE-SET,google_cn_domain,Google
  - RULE-SET,cn_ip,Direct
  - RULE-SET,cn_lite_domain,Direct
  - MATCH,Proxy
sub-rules:
  QUIC:
    - RULE-SET,cn_lite_domain,PASS
    - RULE-SET,cn_ip,PASS
    - MATCH,BANAD
  ADS:
    - RULE-SET,whitelist_domain,PASS
    - MATCH,BANAD
