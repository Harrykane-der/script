# ==================== 基础与扩展配置 ====================
allow-lan: true
ipv6: true
unified-delay: true
tcp-concurrent: true
keep-alive-idle: 600
keep-alive-interval: 60
disable-keep-alive: false
find-process-mode: always
external-controller: 127.0.0.1:9090
external-ui: /data/user/0/com.appshub.bettbox/files/ui
external-ui-url: https://v6.gh-proxy.org/https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip
secret: bettbox
profile:
  store-selected: true
  store-fake-ip: true

# ==================== TUN 配置 ====================
tun:
  enable: true
  stack: mips
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  dns-hijack:
    - any:53
    - any:853
  device: Bettbox
  mtu: 9000
  strict-route: true
  inet6-address:
    - fdfe:dcba:9876::1/126
  iproute2-table-index: 2022
  iproute2-rule-index: 9000
  endpoint-independent-nat: true

