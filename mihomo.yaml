  ai_domain:
    <<: *domainmrs
    url: https://v6.gh-proxy.org/https://github.com/Harrykane-der/ruleset-for-singbox-and-mihomo/raw/refs/heads/rule_set/ai_domain.mrs
    path: ./ruleset/ai_domain.mrs
