# ==================== Sniffer 配置 ====================
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      override-destination: true
    TLS:
      override-destination: false
    QUIC:
      override-destination: false
  skip-domain:
    - rule-set:telegram_domain
  skip-dst-address:
    - rule-set:telegram_ip
  skip-src-address:
    - rule-set:telegram_ip

# ==================== DNS 配置 ====================
dns:
  enable: true
  ipv6: true
  ipv6-timeout: 500
  use-hosts: true
  use-system-hosts: false
  prefer-h3: false
  respect-rules: false
  listen: 127.0.0.1:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-range6: 2001:2::/48
  fake-ip-ttl: 1
  fake-ip-filter-mode: rule
  fake-ip-filter:
    - RULE-SET,game_domain,real-ip
    - RULE-SET,fakeip-filter_cn_domain,real-ip
    - RULE-SET,fakeip-filter_!cn_domain,real-ip
    - RULE-SET,ai_domain,fake-ip
    - RULE-SET,bilibili_domain,fake-ip
    - RULE-SET,direct_emby_domain,fake-ip
    - RULE-SET,github_domain,fake-ip
    - RULE-SET,google_cn_domain,fake-ip
    - RULE-SET,google_domain,fake-ip
    - RULE-SET,media_domain,fake-ip
    - RULE-SET,proxy_emby_domain,fake-ip
    - RULE-SET,pixiv_domain,fake-ip
    - RULE-SET,tiktok_domain,fake-ip
    - RULE-SET,twitter_domain,fake-ip
    - MATCH,real-ip
  default-nameserver:
    - udp://211.138.180.2:53
    - quic://106.54.11.55:853
    - tls://120.53.53.53:853
    - quic://223.5.5.5:853
  nameserver:
    - quic://dns.kimmch6.dpdns.org:7884#Proxy
    - https://dns.google/dns-query#Proxy
  nameserver-policy:
    "rule-set:game_domain":
      - quic://dns.kimmch6.dpdns.org:7884#Games
      - https://dns.google/dns-query#Games

    "rule-set:google_fcm_domain":
      - quic://dns.kimmch6.dpdns.org:7884#FCM
      - https://dns.google/dns-query#FCM

    "rule-set:telegram_domain":
      - quic://dns.kimmch6.dpdns.org:7884#Telegram
      - https://dns.google/dns-query#Telegram

    "rule-set:adblock_domain":
      - rcode://success

    "rule-set:bilibili_domain":
      - quic://dns.kimmch6.dpdns.org:7884#BiliBili
      - https://dns.google/dns-query#BiliBili

    "rule-set:tiktok_domain":
      - quic://dns.kimmch6.dpdns.org:7884#TikTok
      - https://dns.google/dns-query#TikTok

    "rule-set:ai_domain":
      - quic://dns.kimmch6.dpdns.org:7884#AI
      - https://dns.google/dns-query#AI

    "rule-set:pixiv_domain":
      - quic://dns.kimmch6.dpdns.org:7884#Pixiv
      - https://dns.google/dns-query#Pixiv

    "rule-set:media_domain":
      - quic://dns.kimmch6.dpdns.org:7884#Media
      - https://dns.google/dns-query#Media

    "rule-set:proxy_emby_domain":
      - quic://dns.kimmch6.dpdns.org:7884#Emby
      - https://dns.google/dns-query#Emby

    "rule-set:direct_emby_domain":
      - quic://dns.alidns.com:853#Direct
      - udp://211.138.180.2:53

    "rule-set:github_domain":
      - quic://dns.kimmch6.dpdns.org:7884#Github
      - https://dns.google/dns-query#Github

    "rule-set:google_domain":
